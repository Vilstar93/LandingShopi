name: verify

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unit tests
        run: npm test

      - name: Tests do not write to the real request log
        run: |
          # The suite drives the real handler. If it ever writes to data/, it
          # mixes invented firms into the operator's client list.
          if [ -e data/requests.jsonl ]; then
            echo "The test suite wrote to the real request log"; exit 1
          fi
          echo "The request log was not touched by the suite"

      - name: Handlers parse
        run: |
          node --check api/verify.js
          node --check api/submit.js
          node --check api/_vies.js
          node --check lib/affiliate.js
          node --check lib/store.js
          node --check lib/openclaw.js
          node --check public/lib/eik.js
          node --check public/app.js
          node --check scripts/dev-server.mjs
          node --check scripts/requests.mjs

      - name: Client data is never committed
        run: |
          # data/ holds submitted firm details and is gitignored. If it is ever
          # tracked, the guard has been defeated.
          if git ls-files --error-unmatch data/requests.jsonl >/dev/null 2>&1; then
            echo "Submitted client data is tracked by git"; exit 1
          fi
          if ! grep -q '^data/$' .gitignore; then
            echo "data/ is missing from .gitignore"; exit 1
          fi
          echo "data/ is untracked and ignored"

      - name: No secrets are committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo ".env is tracked by git"; exit 1
          fi
          echo ".env is untracked"

      - name: The agent bridge sends no unauthenticated traffic
        run: |
          # A URL without a token must not enable the bridge.
          node -e "
            delete process.env.OPENCLAW_TOKEN;
            process.env.OPENCLAW_URL = 'http://agent.local';
            import('./lib/openclaw.js').then(({ openclawConfig }) => {
              if (openclawConfig().enabled) {
                console.error('Bridge enabled without a token');
                process.exit(1);
              }
              console.log('Bridge requires both URL and token');
            });
          "

      - name: Page has no unrendered placeholders
        run: |
          if grep -q '{{' public/index.html; then
            echo "Unrendered placeholder"; exit 1
          fi

      - name: The affiliate link is not hard-coded in the page
        run: |
          if grep -q 'pxf\.io' public/index.html public/app.js; then
            echo "Affiliate link must come from the environment, not the page"; exit 1
          fi

      - name: The page does not open windows or frames
        run: |
          # Only real code counts; a comment mentioning window.open is fine.
          if grep -nE 'window\.open|<iframe|target="_blank"' public/app.js public/index.html \
             | grep -vE '^\S+:[0-9]+:\s*(//|\*|<!--)'; then
            echo "Affiliate link must be a same-tab navigation"; exit 1
          fi
